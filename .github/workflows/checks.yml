name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bundle:android
      - run: npm run bundle:ios
      - run: npm run typecheck:web -w @pogo-lens/mobile
      - run: npm run build:web -w @pogo-lens/mobile

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Check Android
        working-directory: apps/mobile/android
        run: bash gradlew --no-daemon -PreactNativeArchitectures=arm64-v8a testDebugUnitTest lintDebug assembleDebug


  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check capture privacy filter
        run: |
          swiftc apps/mobile/ios/CaptureShared/PokemonFrameText.swift apps/mobile/ios/CaptureShared/CaptureFrameFingerprint.swift apps/mobile/ios/CaptureShared/CaptureDedupPolicy.swift apps/mobile/ios/CaptureSharedTests/main.swift -o "$RUNNER_TEMP/pogo-frame-text-check"
          "$RUNNER_TEMP/pogo-frame-text-check"
      - name: Install Ruby dependencies
        working-directory: apps/mobile
        run: bundle install --jobs 4 --retry 2
      - name: Install CocoaPods
        working-directory: apps/mobile
        run: bundle exec pod install --project-directory=ios
      - name: Build iOS simulator app and broadcast extension
        working-directory: apps/mobile/ios
        run: xcodebuild -workspace PogoLens.xcworkspace -scheme PogoLens -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
